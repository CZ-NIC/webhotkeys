name: Release

# Pushing a bare version tag (0.10.0 - no "v", see .npmrc) publishes to npm.
# The jsDelivr CDN serves the npm tarball, so the CDN link goes live once this workflow ends;
# dist/WebHotkeys.min.js is built into the tarball by the `prepack` script, not committed to git.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm Trusted Publishing (OIDC) - no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1, newer than the one bundled with Node 22.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build # dist/ is gitignored, test:min needs it built first
      - run: npm run test:min

      - name: The tag must match the version in package.json
        run: |
          test "${GITHUB_REF_NAME}" = "$(node -p "require('./package.json').version")" \
            || { echo "::error::tag ${GITHUB_REF_NAME} != package.json version"; exit 1; }

      # A tag may be (re)pushed just to feed jsDelivr; publishing the same version twice is an error.
      - name: Is this version already on npm?
        id: published
        run: |
          npm view "webhotkeys@${GITHUB_REF_NAME}" version >/dev/null 2>&1 \
            && echo "skip=true" >> "$GITHUB_OUTPUT" \
            || echo "skip=false" >> "$GITHUB_OUTPUT"

      # Set the trusted publisher up once at npmjs.com (package -> Settings -> Trusted publisher:
      # this repository + workflow "release.yml"). Until then, swap this for a classic token:
      #   env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
      - if: steps.published.outputs.skip == 'false'
        run: npm publish --provenance --access public

      # GitHub release, so that "Watch -> Releases" notifies - the only notification the <script> tag users
      # of jsDelivr can get. Notes are the CHANGELOG.md section of the tag. A re-pushed tag keeps its release.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG already exists"; exit 0; }
          awk -v tag="$TAG" '/^# /{found = ($2 == tag); next} found' CHANGELOG.md > notes.md
          grep -q "[^[:space:]]" notes.md || { echo "::error::no CHANGELOG.md section for $TAG"; exit 1; }
          gh release create "$TAG" dist/WebHotkeys.min.js --title "$TAG" --notes-file notes.md --verify-tag
