name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests against the source
        run: npm test

      # dist/WebHotkeys.min.js is not committed (jsDelivr serves it from the npm tarball), but the SRI
      # hash of it in README.md is. esbuild is pinned to an exact version, so rebuilding here must
      # reproduce that hash byte for byte - if it does not, the README snippet would go stale.
      - name: Rebuild and check the SRI hash in README.md is up to date
        run: |
          npm run build
          git diff --exit-code -- README.md \
            || { echo "::error::README.md is out of date - run 'npm run build' and commit"; exit 1; }

      - name: Tests against the minified build
        run: npm run test:min
