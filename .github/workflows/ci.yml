name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call: # release.yml runs this very suite before it publishes anything

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests against the source
        run: npm test

      # dist/WebHotkeys.min.js is not committed (jsDelivr serves it from the npm tarball), but the SRI
      # hash of it in README.md is. esbuild is pinned to an exact version, so rebuilding must reproduce
      # that hash byte for byte. Only on a release tag: between releases README.md describes the last
      # released version while src/ already moves on, so the hash legitimately differs there.
      - run: npm run build
      - name: The SRI hash in README.md matches the build
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git diff --exit-code -- README.md \
            || { echo "::error::README.md is out of date - the release must stamp it (npm run release)"; exit 1; }

      - name: Tests against the minified build
        run: npm run test:min
