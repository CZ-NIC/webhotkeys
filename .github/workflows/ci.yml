name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci

      - name: Tests against the source
        run: npm test

      # The minified file and the SRI hash in README.md are committed artifacts. Rebuild them
      # and fail if anything moved - that is what keeps the README snippet from going stale.
      - name: Rebuild and check the committed artifacts are up to date
        run: |
          npm run build
          git diff --exit-code -- WebHotkeys.min.js README.md \
            || { echo "::error::WebHotkeys.min.js / README.md are out of date - run 'npm run build' and commit"; exit 1; }

      - name: Tests against the minified build
        run: npm run test:min
