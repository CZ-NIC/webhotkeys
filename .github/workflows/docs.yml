name: Docs

# Builds the mkdocs-material site from docs/ and mkdocs.yml and publishes it to the
# gh-pages branch, which GitHub Pages serves (see repo Settings -> Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
